<script>
(function () {
  /*
   * HeyForm Auto-Advance Script
   * Avanza automaticamente alla slide successiva quando l'utente seleziona
   * una risposta in un blocco a scelta singola.
   *
   * NON avanza per:
   *  - multiple_choice con allowMultiple=true (più selezioni possibili)
   *  - campi testo (short_text, long_text, email, phone, number, date, url)
   *
   * Logica:
   *  - Intercetta click su .heyform-radio-container
   *  - Conta i .heyform-radio-selected nel blocco PRIMA del click
   *  - Se pre-count >= 1: un secondo elemento è stato selezionato => multiple => skip
   *  - Se pre-count == 0: prima selezione => aspetta 600ms => se ancora 1 solo selezionato => avanza
   */

  var ADVANCE_DELAY = 600;  // ms prima di cliccare Next
  var pendingTimer = null;

  function getActiveBlock() {
    // Il blocco attivo non ha la classe heyform-block-inactive
    var blocks = document.querySelectorAll('.heyform-block');
    for (var i = 0; i < blocks.length; i++) {
      if (!blocks[i].classList.contains('heyform-block-inactive') &&
          !blocks[i].classList.contains('heyform-block-leaving') &&
          !blocks[i].classList.contains('heyform-block-leaving-active') &&
          !blocks[i].classList.contains('heyform-block-entering')) {
        return blocks[i];
      }
    }
    return null;
  }

  function countSelected(block) {
    return block.querySelectorAll('.heyform-radio.heyform-radio-selected').length;
  }

  function clickNextButton(block) {
    // IMPORTANTE: va premuto il pulsante di conferma della slide (OK / Avanti),
    // che valida e SALVA la risposta. NON la freccia di navigazione
    // (button.heyform-pagination-next): quella cambia slide senza salvare
    // la risposta e all'invio finale il form torna alla prima domanda.
    var btn = block.querySelector('button.heyform-submit-button');
    if (btn && !btn.disabled) {
      btn.click();
    }
  }

  function isTextInputBlock(block) {
    // I blocchi di testo non hanno .heyform-radio-group
    // Verifica se il blocco è di tipo testo puro
    var radioGroup = block.querySelector('.heyform-radio-group');
    return !radioGroup;
  }

  function handleChoiceClick(e) {
    var container = e.target;

    // Risali fino a trovare .heyform-radio-container
    while (container && !container.classList.contains('heyform-radio-container')) {
      container = container.parentElement;
    }
    if (!container) return;

    // Risali fino al blocco attivo
    var block = container;
    while (block && !block.classList.contains('heyform-block')) {
      block = block.parentElement;
    }
    if (!block) return;

    // Se è un blocco testo (no radio-group) non fare nulla
    if (isTextInputBlock(block)) return;

    // Conta le selezioni PRIMA di questo click
    var preCount = countSelected(block);

    // Cancella eventuali timer pendenti
    if (pendingTimer) {
      clearTimeout(pendingTimer);
      pendingTimer = null;
    }

    // Se c'era già almeno 1 selezione e ne sta aggiungendo un'altra => allowMultiple => skip
    if (preCount >= 1) {
      // Potrebbe anche stare deselezionando (toggle) in allowMultiple,
      // in ogni caso non auto-avanziamo
      return;
    }

    // Prima selezione: aspetta e poi controlla
    pendingTimer = setTimeout(function () {
      pendingTimer = null;
      var postCount = countSelected(block);

      // Se è ancora 1 sola selezione => è singola => avanza
      if (postCount === 1) {
        // Verifica che il blocco sia ancora attivo
        if (!block.classList.contains('heyform-block-inactive') &&
            !block.classList.contains('heyform-block-leaving') &&
            !block.classList.contains('heyform-block-leaving-active')) {
          clickNextButton(block);
        }
      }
      // Se 0 (deselezionato) o 2+ (multiple) => non fare nulla
    }, ADVANCE_DELAY);
  }

  // Usa event delegation sul document per catturare i click
  // useCapture=true per intercettare prima che React gestisca l'evento
  document.addEventListener('click', handleChoiceClick, true);
})();
</script>
<script>
(function () {
  /* Meta Pixel: legge il Pixel ID salvato dal pannello admin per questo form */
  var m = window.location.pathname.match(/\/form\/([A-Za-z0-9]+)/);
  if (!m) return;
  fetch('/webhook/pixel/' + m[1], { credentials: 'omit' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.pixelId || window.fbq) return;
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.type='text/plain';t.className='_iub_cs_activate';t.setAttribute('data-suppressedsrc',v);t.setAttribute('data-iub-purposes','5');s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
      /* evita il caricamento dello script secondario signals/config (bloccato da Iubenda) */
      window.fbq('set', 'autoConfig', false, d.pixelId);
      window.fbq('init', d.pixelId);
      window.fbq('track', 'PageView');
    })
    .catch(function () {});
})();
</script>
<script>
(function () {
  /* Meta Pixel: evento Lead a invio completato con successo (mutation completeSubmission).
     HeyForm (Apollo) invia via XMLHttpRequest; hook anche su fetch per sicurezza. */
  if (window.__witLeadHook) return;
  window.__witLeadHook = true;
  function isOk(txt) {
    try {
      var j = JSON.parse(txt);
      return !!(j && j.data && j.data.completeSubmission && !(j.errors && j.errors.length));
    } catch (e) { return false; }
  }
  function fireLead() {
    if (window.__witLeadSent) return;
    window.__witLeadSent = true;
    if (typeof window.fbq === 'function') { window.fbq('track', 'Lead'); }
  }
  /* XMLHttpRequest */
  var xSend = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.send = function (body) {
    try {
      if (typeof body === 'string' && body.indexOf('completeSubmission') !== -1) {
        this.addEventListener('load', function () {
          try { if (this.status >= 200 && this.status < 300 && isOk(this.responseText)) fireLead(); } catch (e) {}
        });
      }
    } catch (e) {}
    return xSend.apply(this, arguments);
  };
  /* fetch */
  if (window.fetch) {
    var origFetch = window.fetch;
    window.fetch = function (input, init) {
      var p = origFetch.apply(this, arguments);
      try {
        var body = init && typeof init.body === 'string' ? init.body : '';
        if (body.indexOf('completeSubmission') !== -1) {
          p.then(function (res) { return res.clone().text().then(function (t) { if (isOk(t)) fireLead(); }); }).catch(function () {});
        }
      } catch (e) {}
      return p;
    };
  }
})();
</script>
